name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - name: Build (local backend, CI only)
        run: pnpm build
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3100
          WITCAR_DB: pglite
          WITCAR_AUTH: dev
          WITCAR_ALLOW_DEV_BACKEND: "1"
          WITCAR_SESSION_SECRET: e2e-session-secret-0123456789-abcdefghij
          WEATHER_PROVIDER: mock
          STOCKS_PROVIDER: mock
          CRYPTO_PROVIDER: mock
          STRIPE_WEBHOOK_SECRET: whsec_e2e_test_secret
          STRIPE_PRICE_PRO_MONTHLY: price_e2e_monthly
      - run: pnpm exec playwright install --with-deps chromium
      - name: E2E
        run: pnpm e2e
        env:
          E2E_SKIP_BUILD: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
      - name: Dependency audit
        run: pnpm audit --prod --audit-level high
