<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WitCar – offline</title>
    <style>
      html, body { margin: 0; height: 100%; background: #efeff1; color: #0e0e10; font-family: system-ui, sans-serif; }
      main { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center; padding: 24px; }
      p { color: #5b5b63; max-width: 32rem; }
      @media (prefers-color-scheme: dark) {
        html, body { background: #050505; color: #f5f5f6; }
        p { color: #a1a1a9; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Keine Verbindung</h1>
      <p>WitCar lädt automatisch neu, sobald wieder Internet verfügbar ist. Tipp: Prüfe, ob der Handy-Hotspot aktiv ist.</p>
    </main>
    <script>
      window.addEventListener("online", function () { location.reload(); });
      setInterval(function () { if (navigator.onLine) location.reload(); }, 30000);
    </script>
  </body>
</html>
